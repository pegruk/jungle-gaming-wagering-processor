services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: distributed_wagering_processor
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distributed_wagering_processor"]
      interval: 3s
      timeout: 3s
      retries: 5
  localstack:
    image: localstack/localstack:4
    container_name: wagering_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh

volumes:
  pgdata:
    driver: local
